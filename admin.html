<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: three panes. Project list on the left, the editor in the middle,
   a live card preview on the right. Same paper/ink/red as the site. */
:root {
  --bg: #ececec; --panel: #f6f6f4; --ink: #1c1c1c; --muted: #77776f; --line: #d7d7d2;
  --accent: #ff4b3e; --ok: #1f8a4c; --warn: #b26b00;
  --f-ui: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-display: "Bricolage Grotesque", "Arial Narrow", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { font: 500 20px/1 var(--f-display); font-stretch: 80%; text-transform: uppercase; letter-spacing: -.01em; margin: 0; }
.brand small { font: 400 11px var(--f-mono); color: var(--muted); text-transform: none; margin-left: 8px; letter-spacing: 0; }
.status { font: 400 11px/1.3 var(--f-mono); color: var(--muted); margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; min-width: 0; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.status.is-linked i { background: var(--ok); }
.status.is-dirty i { background: var(--accent); }
.noimg { display: block; background: repeating-linear-gradient(45deg, #ddddd8 0 6px, #e6e6e2 6px 12px); aspect-ratio: 4 / 3; width: 100%; }
.item__thumb.noimg { width: 44px; height: 33px; }
a.btn { color: inherit; text-decoration: none; }
.btn { border: 1px solid var(--ink); background: transparent; padding: 7px 12px; border-radius: 99px; white-space: nowrap; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn--solid { background: var(--ink); color: var(--bg); }
.btn--solid:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn--ghost { border-color: var(--line); }
.btn--danger { border-color: var(--accent); color: var(--accent); }
.btn--danger:hover { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; pointer-events: none; }

.login { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); padding: 20px; }
.login form { width: min(360px, 100%); display: grid; gap: 14px; }
.login h2 { margin: 0; font: 400 32px/1 var(--f-display, inherit); text-transform: uppercase; }
.login p { margin: 0; color: var(--muted); font-size: 12px; }
.login .err { color: var(--accent); }
.note { margin: 12px 20px 0; padding: 10px 12px; background: #fff3d6; border: 1px solid #f0d699; font-size: 12px; }
.note code { font-family: var(--f-mono); font-size: 11px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 0; min-height: calc(100% - 60px); }
.pane { padding: 16px 20px 40px; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--line); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.tab { border: 1px solid var(--line); background: transparent; padding: 5px 10px; border-radius: 99px; font-size: 12px; }
.tab.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; }
.item {
  display: grid; grid-template-columns: 18px 44px minmax(0, 1fr); gap: 10px; align-items: center;
  padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer;
}
.item:hover { background: var(--panel); }
.item.is-on { background: #fff; border-color: var(--line); }
.item.is-drop { border-color: var(--accent); border-style: dashed; }
.item__grip { color: var(--muted); cursor: grab; font-size: 12px; text-align: center; }
.item__thumb { width: 44px; height: 33px; object-fit: cover; background: var(--line); border-radius: 2px; }
.item__t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item__s { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font: 400 11px var(--f-mono); color: var(--muted); margin: 0 0 8px; }

.form { display: grid; gap: 18px; max-width: 760px; }
.form h2 { margin: 0; font: 500 clamp(28px, 3vw, 40px)/.95 var(--f-display); font-stretch: 78%; text-transform: uppercase; color: var(--accent); text-wrap: balance; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font: 400 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field > span em { font-style: normal; text-transform: none; letter-spacing: 0; }
.field input[type="text"], .field input[type="url"], .field input[type="email"], .field select, .field textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
}
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); outline: none; }
.err { color: var(--accent); font-size: 11px; }
.rows { display: grid; gap: 8px; justify-items: start; }
.rowed { display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 8px; align-items: start; width: 100%; }
.rowed--3 { grid-template-columns: 24px minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, .8fr) auto; }
.rowed__n { font: 400 11px var(--f-mono); color: var(--muted); padding-top: 10px; }
.rowed input, .rowed textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
.rowed textarea { resize: vertical; min-height: 38px; }
.rowed input:focus, .rowed textarea:focus { border-color: var(--ink); outline: none; }
.rowed__b { display: flex; gap: 4px; padding-top: 4px; }
.rowed__b button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 99px; background: transparent; }
.rowed__b button:disabled { opacity: .3; }
.rowed__b button:hover:not(:disabled) { border-color: var(--ink); }

.sect { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }
.sect h3 { margin: 0; font: 600 12px var(--f-ui); text-transform: uppercase; letter-spacing: .04em; }
.sect p.hint { margin: -6px 0 0; color: var(--muted); font-size: 12px; }

.drop {
  border: 1px dashed #b9b9b2; border-radius: 8px; padding: 16px; text-align: center; color: var(--muted);
  background: var(--panel); cursor: pointer; transition: border-color .2s, background .2s;
}
.drop:hover, .drop.is-over { border-color: var(--accent); background: #fff; color: var(--ink); }
.cover { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: start; }
.cover img { width: 200px; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); border-radius: 4px; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.gimg { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; cursor: grab; }
.gimg.is-drop { outline: 2px dashed var(--accent); }
.gimg img { width: 100%; height: 90px; object-fit: cover; object-position: top; display: block; background: var(--line); }
.gimg__bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font: 400 10px var(--f-mono); color: var(--muted); }
.gimg__bar button { border: 0; background: none; color: var(--accent); padding: 0 2px; }

.swatches { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.swatches input[type="color"] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; color: var(--accent); }

/* preview pane */
.prev { position: sticky; top: 76px; display: grid; gap: 14px; }
.prev__k { font: 400 11px var(--f-mono); color: var(--muted); text-transform: uppercase; margin: 0; }
.card { background: #fff; border: 1px solid var(--line); padding: 14px; display: grid; gap: 8px; }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); }
.cover--wide { grid-template-columns: 1fr; }
.cover--wide img, .card img.is-wide { width: 100%; aspect-ratio: 6.2 / 1; object-position: 0 50%; }
.cover img.is-169, .card img.is-169 { aspect-ratio: 16 / 9; }
.card__cat { color: var(--muted); font-size: 11px; margin: 0; }
.card__t { margin: 0; font: 500 18px/1 var(--f-display); text-transform: uppercase; }
.card__d { margin: 0; font-size: 12px; }
.card__sw { display: flex; gap: 3px; }
.card__sw i { width: 14px; height: 14px; display: block; }
.big { margin: 0; font: 500 44px/.86 var(--f-display); font-stretch: 75%; text-transform: uppercase; color: var(--accent); text-wrap: balance; }
.prev a { color: inherit; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); translate: -50% 10px; opacity: 0; transition: .25s; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 99px; pointer-events: none; z-index: 30; max-width: calc(100vw - 32px); }
.toast.is-on { opacity: 1; translate: -50% 0; }

.empty { padding: 40px 0; color: var(--muted); max-width: 46ch; }
.empty h2 { color: var(--ink); font: 500 32px/.95 var(--f-display); font-stretch: 80%; text-transform: uppercase; margin: 0 0 10px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
  .pane--prev { display: none; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .grid2, .grid3, .cover { grid-template-columns: 1fr; }
  .cover img { width: 100%; }
  .rowed, .rowed--3 { grid-template-columns: minmax(0, 1fr) auto; }
  .rowed__n { display: none; }
  .rowed > input, .rowed > textarea { grid-column: 1; }
  .rowed__b { grid-column: 2; grid-row: 1; }
  .top { padding: 10px 16px; }
  .pane { padding-inline: 16px; }
}
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">Dashboard<small>portfolio content</small></h1>
  <p class="status" id="status" role="status"><i></i><span id="statusText">Not linked to a folder</span></p>
  <button class="btn btn--ghost" type="button" id="openBtn">Open portfolio folder</button>
  <button class="btn btn--ghost" type="button" id="signOut" hidden>Sign out</button>
  <a class="btn btn--ghost" id="siteBtn" href="index.html" target="_blank" rel="noopener">View site ↗</a>
  <button class="btn btn--solid" type="button" id="saveBtn" disabled>Save</button>
</header>
<p class="note" id="note" hidden></p>

<div class="app">
  <!-- LIST -->
  <aside class="pane">
    <div class="tabs" role="tablist">
      <button class="tab is-on" type="button" data-tab="projects" role="tab" aria-selected="true">Projects</button>
      <button class="tab" type="button" data-tab="playground" role="tab" aria-selected="false">Playground</button>
      <button class="tab" type="button" data-tab="photos" role="tab" aria-selected="false">Photos</button>
      <button class="tab" type="button" data-tab="joyous" role="tab" aria-selected="false">Joyous</button>
      <button class="tab" type="button" data-tab="about" role="tab" aria-selected="false">About</button>
      <button class="tab" type="button" data-tab="site" role="tab" aria-selected="false">Site</button>
    </div>
    <p class="count" id="count"></p>
    <ol class="list" id="list"></ol>
    <button class="btn" type="button" id="addBtn">+ New project</button>
  </aside>

  <!-- EDITOR -->
  <main class="pane" id="editor"></main>

  <!-- PREVIEW -->
  <aside class="pane pane--prev">
    <div class="prev" id="prev"></div>
  </aside>
</div>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="filePickMulti" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h2 id="loginTitle">Sign in</h2>
    <p id="loginText">Enter the dashboard password.</p>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required minlength="8"></label>
    <label class="field" id="loginAgain" hidden><span>Password again</span><input type="password" name="again" autocomplete="new-password"></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn btn--solid" type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<script>
(() => {
  /* =========================================================
     DASHBOARD
     Edits projects, playground, photos, Joyous and site settings.
     Two ways to save:
     1. Server (preferred): when the page is served by server.js or a PHP
        host (api/index.php), it signs in and saves to the project's
        database (data/content.json), which also rebuilds
        assets/projects.js. Uploads go straight into images/ and audio/.
     2. Folder: opened any other way, it uses the browser's folder access
        (Chrome / Edge) to write into a folder on your computer.
     ========================================================= */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const DISCIPLINES = ["UX/UI", "Graphic", "Motion"];
  const JOY_KINDS = ["Game", "3D object", "Space", "Toy"];
  // the experiences built in assets/joyous.js (a new one needs code)
  const JOY_PLAYS = { flappy: "Phu Flies (tap to fly)", blob: "Chrome Blob (liquid metal ball)", island: "Tiny Island (plant trees)", stack: "Stack (block stacking)", galaxy: "Spiral (galaxy of stars)", ballpit: "Ball Pit (throw the balls)" };
  const MAX_SIDE = 2400;           // longest side after optimising
  const WEBP_QUALITY = 0.85;

  const state = {
    dir: null,                     // FileSystemDirectoryHandle of the portfolio folder
    data: { SITE: {}, PROJECTS: [], PLAYGROUND: [], PHOTOS: [] },
    tab: "projects", sel: 0, dirty: false, optimise: true,
    blobs: new Map(),              // image path -> object URL (for previews)
    pending: new Map(),            // image path -> Blob waiting to be written (when no folder yet)
    confirmDelete: false,
  };

  /* ---------------- helpers ---------------- */
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("is-on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("is-on"), 2400); };
  const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project";
  const fsOK = "showDirectoryPicker" in window;

  /* ---------------- server API (server.js or api/index.php) ---------------- */
  // on Vercel: uploads wait as git blobs until the next save commits them (base = content.json version loaded)
  const server = { on: false, kind: "", uploads: [], base: null };
  async function api(r, { q = "", json, body } = {}) {
    const post = json !== undefined || body !== undefined;
    const res = await fetch(`api/?r=${r}${q}`, {
      method: post ? "POST" : "GET", credentials: "same-origin", cache: "no-store",
      headers: { "X-Admin": "1", ...(json !== undefined ? { "Content-Type": "application/json" } : { "Content-Type": "application/octet-stream" }) },
      body: json !== undefined ? JSON.stringify(json) : body,
    });
    const j = await res.json().catch(() => ({ error: `The server answered ${res.status}` }));
    if (!res.ok) { const e = new Error(j.error || res.status); e.status = res.status; throw e; }
    return j;
  }
  async function probeServer() {
    try { const st = await api("status"); return st && st.ok ? st : null; } catch (e) { return null; }
  }
  // ask for the password (or to create one on first run) until signed in
  function signIn(st) {
    return new Promise(done => {
      const box = $("#login"), f = $("#loginForm"), setup = !st.hasPassword;
      $("#loginTitle").textContent = setup ? "Set a password" : "Sign in";
      $("#loginText").innerHTML = setup
        ? (st.canSetup ? "First time here: choose a dashboard password (8+ characters). It is saved, hashed, in <code>data/auth.php</code>; upload that folder with the site and the same password works on your host."
                       : st.server === "vercel" ? "Saving online is not set up yet: add ADMIN_PASSWORD and GITHUB_TOKEN in Vercel (Settings, Environment Variables), then redeploy."
                       : "No password yet. Run <code>start.bat</code> on your computer to set one, then upload the <code>data</code> folder to the host.")
        : "Enter the dashboard password.";
      $("#loginAgain").hidden = !setup; $("#loginBtn").textContent = setup ? "Save password" : "Sign in";
      $("#loginBtn").disabled = setup && !st.canSetup;
      f.password.autocomplete = setup ? "new-password" : "current-password";
      box.hidden = false; f.password.focus();
      f.onsubmit = async e => {
        e.preventDefault(); $("#loginErr").textContent = "";
        if (setup && f.password.value !== f.again.value) { $("#loginErr").textContent = "The two passwords are different"; return; }
        try { await api(setup ? "setup" : "login", { json: { password: f.password.value } }); box.hidden = true; f.reset(); done(); }
        catch (err) { $("#loginErr").textContent = err.message; }
      };
    });
  }
  // the database, unless projects.js was edited by hand after the last save
  async function loadFromServer() {
    const c = await api("content");
    server.base = c.sha || null;
    if (c.content && !(c.projectsMtime > c.contentMtime + 5)) return normalise(c.content);
    return parseProjects(await (await fetch("assets/projects.js", { cache: "no-store" })).text());
  }
  const normalise = c => ({ SITE: c.SITE || {}, PROJECTS: c.PROJECTS || [], PLAYGROUND: c.PLAYGROUND || [], PHOTOS: c.PHOTOS || [], JOYOUS: c.JOYOUS || null, ABOUT: c.ABOUT || null });
  async function upload(blob, base, ext) {
    if (server.kind === "vercel" && blob.size > 4.3 * 1024 * 1024) throw new Error("file is over 4MB, too big for the online dashboard. Add it with start.bat on your computer");
    const pending = server.uploads.map(u => u.path).join(",");
    const r = await api("upload", { q: `&base=${encodeURIComponent(base)}&ext=${encodeURIComponent(ext)}` + (pending ? `&pending=${encodeURIComponent(pending)}` : ""), body: blob });
    if (r.sha) { server.uploads.push({ path: r.path, sha: r.sha }); setDirty(); }
    return r.path;
  }

  function setDirty(v = true) {
    state.dirty = v;
    $("#saveBtn").disabled = !v;
    $("#status").classList.toggle("is-dirty", v);
    renderStatus();
  }
  function renderStatus() {
    const st = $("#status");
    if (server.on) {
      st.classList.add("is-linked");
      $("#statusText").textContent = `Project database (data/content.json)` + (state.dirty ? " · unsaved changes" : " · saved");
      return;
    }
    st.classList.toggle("is-linked", !!state.dir);
    $("#statusText").textContent =
      (state.dir ? `Folder: ${state.dir.name}` : "Not linked to a folder") + (state.dirty ? " · unsaved changes" : state.dir ? " · saved" : "");
  }
  function note(html) { const n = $("#note"); n.innerHTML = html; n.hidden = !html; }

  /* ---------------- parse / serialise projects.js ---------------- */
  function parseProjects(text) {
    const win = {};
    // projects.js only assigns window.SITE / window.PROJECTS / window.PLAYGROUND / window.PHOTOS / window.JOYOUS / window.ABOUT
    new Function("window", text)(win);
    return { SITE: win.SITE || {}, PROJECTS: win.PROJECTS || [], PLAYGROUND: win.PLAYGROUND || [], PHOTOS: win.PHOTOS || [], JOYOUS: win.JOYOUS || null, ABOUT: win.ABOUT || null };
  }
  function serialise(d) {
    const head = `/* =========================================================
   PROJECT DATA (written by admin.html — you can also edit by hand)
   image:       cover shown on the 3D stack (any ratio, cropped to 4:3)
   gallery:     images shown on the project page, top to bottom
   about:       the paragraph on the project page (desc is the short line on home)
   recognition: list of awards, [] when none
   url:         "Visit site" link, "" to hide it
   palette:     three swatch colours shown next to the active project
   PHOTOS:      the Photo page; featured: true (up to 10) also plays in the top banner
   JOYOUS:      the Joyous page: channel name, banner and items; play picks the experience built in assets/joyous.js
   ABOUT:       the About page: title lines, intro, skills, experience, portrait, process & approach
   ========================================================= */\n`;
    const j = v => JSON.stringify(v, null, 2);
    return `${head}window.SITE = ${j(d.SITE)};\n\nwindow.PROJECTS = ${j(d.PROJECTS)};\n\nwindow.PLAYGROUND = ${j(d.PLAYGROUND)};\n\nwindow.PHOTOS = ${j(d.PHOTOS || [])};\n${d.JOYOUS ? `\nwindow.JOYOUS = ${j(d.JOYOUS)};\n` : ""}${d.ABOUT ? `\nwindow.ABOUT = ${j(d.ABOUT)};\n` : ""}`;
  }

  /* ---------------- folder access ---------------- */
  const IDB = {
    db() { return new Promise((res, rej) => { const r = indexedDB.open("portfolio-admin", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    async get(k) { try { const db = await this.db(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
    async set(k, v) { try { const db = await this.db(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) {} },
  };
  async function getDirPath(path, create) {
    const parts = path.split("/").filter(Boolean); let d = state.dir;
    for (const p of parts) d = await d.getDirectoryHandle(p, { create });
    return d;
  }
  async function readFile(path) {
    const parts = path.split("/"); const name = parts.pop();
    const d = await getDirPath(parts.join("/"), false);
    return (await d.getFileHandle(name)).getFile();
  }
  async function writeFile(path, data) {
    const parts = path.split("/"); const name = parts.pop();
    const d = await getDirPath(parts.join("/"), true);
    const fh = await d.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(data); await w.close();
  }
  async function exists(path) { try { await readFile(path); return true; } catch (e) { return false; } }

  async function linkFolder(handle) {
    if ((await handle.queryPermission({ mode: "readwrite" })) !== "granted" &&
        (await handle.requestPermission({ mode: "readwrite" })) !== "granted") { toast("Permission was not granted"); return false; }
    try { await handle.getDirectoryHandle("assets"); }
    catch (e) { toast("That folder has no assets/ folder. Pick the portfolio folder that contains index.html."); return false; }
    state.dir = handle; IDB.set("dir", handle);
    if (state.dirty && state.data.PROJECTS.length) {
      // keep the edits made before linking; flush any images waiting to be written
      for (const [path, blob] of state.pending) await writeFile(path, blob);
      state.pending.clear(); note(""); renderStatus(); toast("Folder linked. Press Save to write your changes."); return true;
    }
    try { state.data = parseProjects(await (await readFile("assets/projects.js")).text()); }
    catch (e) { toast("Could not read assets/projects.js: " + e.message); return false; }
    state.sel = 0; note(""); setDirty(false); render(); toast(`Loaded ${state.data.PROJECTS.length} projects`);

  /* ---------------- images ---------------- */
  async function optimise(file) {
    if (!state.optimise || !/^image\/(jpeg|png|webp)$/.test(file.type)) return { blob: file, ext: (file.name.split(".").pop() || "jpg").toLowerCase() };
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/webp", WEBP_QUALITY));
    return blob && blob.size < file.size ? { blob, ext: "webp" } : { blob: file, ext: (file.name.split(".").pop() || "jpg").toLowerCase() };
  }
  async function addImage(file, base) {
    const { blob, ext } = await optimise(file);
    if (server.on) {
      let path;
      try { path = await upload(blob, "images/" + base, ext); }
      catch (e) {
        if (e.status !== 401) { toast("Upload failed: " + e.message); throw e; }
        await signIn(await probeServer() || { hasPassword: true }); path = await upload(blob, "images/" + base, ext);
      }
      state.blobs.set(path, URL.createObjectURL(blob));
      return path;
    }
    let n = 1, path;
    do { path = `images/${base}-${String(n).padStart(2, "0")}.${ext}`; n++; }
    while ((state.dir && await exists(path)) || state.blobs.has(path) || allPaths().includes(path));
    state.blobs.set(path, URL.createObjectURL(blob));
    if (state.dir) await writeFile(path, blob); else state.pending.set(path, blob);
    return path;
  }
  function allPaths() {
    const d = state.data;
    return [...d.PROJECTS.flatMap(p => [p.image, ...(p.gallery || [])]), ...d.PLAYGROUND.map(p => p.image), ...(d.PHOTOS || []).map(p => p.image), ...(d.JOYOUS ? [d.JOYOUS.banner, ...(d.JOYOUS.items || []).map(p => p.thumb)] : []), d.ABOUT && d.ABOUT.portrait].filter(Boolean);
  }
  function src(path) {
    // preview URL for an image path: fresh upload, file in the linked folder, or the site's own copy
    if (!path) return "";
    if (state.blobs.has(path)) return state.blobs.get(path);
    if (state.dir) {
      readFile(path).then(f => { state.blobs.set(path, URL.createObjectURL(f)); $$(`img[data-path="${CSS.escape(path)}"]`).forEach(i => (i.src = state.blobs.get(path))); }).catch(() => {});
      return "";
    }
    return path;
  }
  const img = (path, cls = "", alt = "") => path
    ? /\.(mp4|webm|mov)$/i.test(path) ? `<video class="${cls}" data-path="${esc(path)}" src="${esc(src(path))}" muted playsinline preload="metadata" style="width:100%;object-fit:cover"></video>`
    : `<img class="${cls}" data-path="${esc(path)}" src="${esc(src(path))}" alt="${esc(alt)}">`
    : `<span class="${cls} noimg" aria-hidden="true"></span>`;
  function pick(multi) {
    return new Promise(res => {
      const inp = multi ? $("#filePickMulti") : $("#filePick");
      inp.value = ""; inp.onchange = () => res([...inp.files]); inp.click();
    });
  }
  async function paletteFrom(path) {
    // three colours from the cover: darkest, most saturated, lightest of the common ones
    const im = new Image(); im.src = src(path) || path; await im.decode();
    const cv = document.createElement("canvas"); cv.width = 48; cv.height = 36;
    const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0, 48, 36);
    const px = ctx.getImageData(0, 0, 48, 36).data, buckets = new Map();
    for (let i = 0; i < px.length; i += 4) {
      const k = [px[i] >> 4, px[i + 1] >> 4, px[i + 2] >> 4].join(",");
      const b = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 }; b.n++; b.r += px[i]; b.g += px[i + 1]; b.b += px[i + 2]; buckets.set(k, b);
    }
    const cols = [...buckets.values()].sort((a, b) => b.n - a.n).slice(0, 12).map(b => [b.r / b.n, b.g / b.n, b.b / b.n]);
    const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    const sat = c => Math.max(...c) - Math.min(...c);
    const dark = cols.reduce((a, c) => (lum(c) < lum(a) ? c : a));
    const light = cols.reduce((a, c) => (lum(c) > lum(a) ? c : a));
    const vivid = cols.filter(c => c !== dark && c !== light).reduce((a, c) => (sat(c) > sat(a) ? c : a), cols[0]);
    const hex = c => "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
    return [hex(dark), hex(vivid), hex(light)];
  }

  /* ---------------- drop zones ---------------- */
  function dropzone(el, onFiles) {
    el.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); el.classList.add("is-over"); } });
    el.addEventListener("dragleave", () => el.classList.remove("is-over"));
    el.addEventListener("drop", e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); el.classList.remove("is-over"); onFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))); });
  }
  function sortable(container, selector, onMove) {
    let from = -1;
    $$(selector, container).forEach((el, i) => {
      el.draggable = true;
      el.addEventListener("dragstart", e => { from = i; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); });
      el.addEventListener("dragover", e => { if (from < 0) return; e.preventDefault(); el.classList.add("is-drop"); });
      el.addEventListener("dragleave", () => el.classList.remove("is-drop"));
      el.addEventListener("drop", e => { if (from < 0) return; e.preventDefault(); el.classList.remove("is-drop"); if (from !== i) onMove(from, i); from = -1; });
      el.addEventListener("dragend", () => (from = -1));
    });
  }

      else if (h) note(`Last time you used the folder <b>${esc(h.name)}</b>. Press <b>Open portfolio folder</b> to continue editing it.`);
    }
    // 2) the site's own projects.js (works when this page is served next to the site)
    try {
      const text = await (await fetch("assets/projects.js", { cache: "no-store" })).text();
      state.data = parseProjects(text);
      if (!$("#note").innerHTML) note(fsOK
        ? `Showing the projects from this site. Press <b>Open portfolio folder</b> and pick the folder that contains <code>index.html</code> so uploads and Save write straight into it.`
        : `Showing the projects from this site. Saving needs Chrome or Edge on a computer: open <code>admin.html</code> from your portfolio folder there.`);
    } catch (e) {
      note(`Press <b>Open portfolio folder</b> and pick the folder that contains <code>index.html</code>.`);
    }
    render();
  })();
})();
</script>
</body>
</html>
